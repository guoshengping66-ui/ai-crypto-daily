name: Clean Workflow History

# ⚠️ 手动清理 Get Hot News 工作流运行记录；不会影响每日定时任务。
# ⚠️ Running this manually permanently deletes the workflow run history.
#
# 请勿为续期而运行；日报现在按仓库中的每日计划持续运行。
# Do not run this to renew the daily schedule.

on:
  workflow_dispatch:

jobs:
  del_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete all workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0
          delete_workflow_by_state_pattern: "ALL"
          delete_run_by_conclusion_pattern: "ALL"
